name: samay
description: "Samay — Social event planning app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod: ^2.6.1
  go_router: ^14.8.1
  flutter_secure_storage: ^9.2.4
  freezed_annotation: ^3.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  supabase_flutter: ^2.8.4
  image_picker: ^1.1.2
  permission_handler: ^12.0.3
  intl: ^0.20.2
  json_annotation: ^4.12.0
  path_provider: ^2.1.6
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  cryptography: ^2.9.0
  characters: ^1.4.0
  flutter_cache_manager: ^3.4.1
  unorm_dart: ^0.3.2
  uuid: ^4.5.3
  # QR attendance + promotor scanner (I-57 re-add per DEP-02/DEP-03
  # re-adoption — removed by I-23 as dead when QR was unbuilt; the
  # phase-06 QRAT/QRSC foundations import them).
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  # RevenueCat SDK (I-61 re-add per DEP-01/RSDK re-add plan; 10.x dropped the
  # transitive freezed_annotation pin that forced the original ^8.4.1 bump).
  purchases_flutter: ^10.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  yaml: ^3.1.3
  mocktail: ^1.0.4
  file: ^7.0.1
  build_runner: ^2.15.1
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
        - asset: assets/fonts/PlayfairDisplay-Italic-Variable.ttf
          style: italic
