name: samay
description: "Samay — party games for a group of friends"
publish_to: 'none'
version: 1.0.0+6

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod: ^2.6.1
  go_router: ^14.8.1
  flutter_secure_storage: ^9.2.4
  freezed_annotation: ^3.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  supabase_flutter: ^2.8.4
  # Push notifications (Track 2 PUSH): FCM HTTP v1 (Android) + APNs (iOS).
  # Client wiring is dark-first behind AppFeatureFlag.push; the backend sends
  # with an operator-supplied FCM service account. Requires Firebase platform
  # config (android/app/google-services.json via `flutterfire configure`) and
  # the google-services Gradle plugin (settings.gradle.kts / app build.gradle.kts).
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  image_picker: ^1.1.2
  # Connectivity awareness (I-67): device network status for the offline
  # banner + future offline-cache fallbacks. Flutter favorite, verified
  # publisher fluttercommunity.dev. Injectable seam in
  # lib/core/services/connectivity_service.dart — the plugin itself is only
  # touched by the default stream/check implementations.
  connectivity_plus: ^7.3.1
  intl: ^0.20.2
  json_annotation: ^4.12.0
  path_provider: ^2.1.6
  cupertino_icons: ^1.0.8
  # Legal document links (privacy/terms) opened in the system browser.
  url_launcher: ^6.3.0
  cached_network_image: ^3.4.1
  cryptography: ^2.9.0
  characters: ^1.4.0
  flutter_cache_manager: ^3.4.1
  unorm_dart: ^0.3.2
  uuid: ^4.5.3
  # QR attendance + host scanner (I-57 re-add per DEP-02/DEP-03
  # re-adoption — removed by I-23 as dead when QR was unbuilt; the
  # phase-06 QRAT/QRSC foundations import them). 7.x: iOS backend moved
  # from MLKit (no arm64-simulator slice — blocked `flutter run` on
  # Apple Silicon iOS 26+ simulators) to Apple Vision.
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  # Client-side image downscale + JPEG re-encode for every upload (PERF-03 /
  # M-36): Flutter's dart:ui can decode most formats but only re-encode to PNG,
  # so the `image` package (pure Dart) does the quality-80 JPEG encode that
  # slashes storage size and, for E2EE minigame images, decryption time. Used
  # by ImageProcessor; already a transitive dep of dev tooling, so promoting it
  # adds zero new packages.
  image: ^4.8.0
  # Deep-link / universal-link handling for invite links `samay://event/{token}`
  # (EINV — I-66). Already a transitive dep of supabase_flutter (>=6.2.0 <8.0.0)
  # and registered as a native plugin on every platform, so the direct
  # dependency adds zero new packages. Platform intent-filter / Associated
  # Domains config is M-27/M-28 work (DEPLOYMENT-PLACEHOLDER.md R01).
  app_links: ^7.0.0
  # RevenueCat SDK (I-61 re-add per DEP-01/RSDK re-add plan; 10.x dropped the
  # transitive freezed_annotation pin that forced the original ^8.4.1 bump).
  purchases_flutter: ^10.8.0
  http: ^1.4.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.7
  flutter_local_notifications: ^22.3.2
  # Accelerometer for the local charadas turn: the player holds the phone on
  # their forehead, face-DOWN = +1 and face-UP = skip. Falls back to tap zones,
  # so the game is still playable when the sensor is unavailable.
  sensors_plus: ^7.1.0

dev_dependencies:
  # Q16 (owner decision): the no-Dart-tests rule is rescinded for critical
  # flows. Pure logic tests live in test/*.dart; the backend remains the
  # integration authority (Go, pgTAP, curl opt-tests).
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.14.1
  # Launcher-icon generation (TOOL-06, U-20): single 1024x1024 source
  # (assets/icons/app_icon.png, regenerated by tools/icon_gen.dart) → every
  # Android mipmap + iOS AppIcon size. Verified publisher fluttercommunity.dev.
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  # Bundled brand icon for the "Continue with Google" control. Official Google
  # "G" (from the Google Sign-In SDK, Apache-2.0); density variants resolve from
  # assets/icons/{2.0x,3.0x}/google.png. See assets/icons/NOTICE for provenance
  # and the Google branding requirements (full color, on white, unmodified).
  #
  # The Apple logo-only SVG is the official artwork from Apple Design Resources
  # (Logo-Sign-in-with-Apple.dmg), bundled unmodified and rendered via
  # flutter_svg for the logo-only Sign in with Apple control. See
  # assets/icons/NOTICE for provenance and the HIG usage terms.
  assets:
    - assets/icons/google.png
    - assets/icons/apple_logo_only.svg
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Variable.ttf
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
        - asset: assets/fonts/PlayfairDisplay-Italic-Variable.ttf
          style: italic

# Launcher icons (TOOL-06, U-20) — one source asset, all platform sizes:
#   dart run flutter_launcher_icons
# The source is regenerable and deterministic (tools/icon_gen.dart). The
# adaptive foreground carries the shard artwork only (transparent bg); the
# black background is the brand P1 constant, so it is declared as the
# adaptive background color instead of shipped as image pixels.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  min_sdk_android: 21
